version: "3.9"
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  server:
    build: ./server
    ports: ["4000:4000"]
    env_file: ./server/.env
    depends_on: [mongo]
    environment:
      MONGO_URI: mongodb://mongo:27017/dungeonquest
volumes:
  mongo_data: