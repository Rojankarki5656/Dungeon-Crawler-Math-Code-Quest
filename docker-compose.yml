version: '3.9'

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ['5672:5672', '15672:15672']
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: node dist/main.js
    ports: ['4000:4000']
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      REDIS_URL: redis://redis:6379
      BROKER_TRANSPORT: redis-streams
      BROKER_CONSUMER_NAME: api-1
    depends_on:
      redis: { condition: service_healthy }

  api-2:
    build: ./backend
    command: node dist/main.js
    ports: ['4001:4000']
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      REDIS_URL: redis://redis:6379
      BROKER_TRANSPORT: redis-streams
      BROKER_CONSUMER_NAME: api-2
    depends_on:
      redis: { condition: service_healthy }

  worker-1:
    build: ./backend
    command: node dist/worker.main.js
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      BROKER_TRANSPORT: redis-streams
      BROKER_CONSUMER_NAME: worker-1
    depends_on:
      redis: { condition: service_healthy }

  worker-2:
    build: ./backend
    command: node dist/worker.main.js
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      BROKER_TRANSPORT: redis-streams
      BROKER_CONSUMER_NAME: worker-2
    depends_on:
      redis: { condition: service_healthy }

volumes:
  redis-data: